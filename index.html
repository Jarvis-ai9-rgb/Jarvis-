<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>
<style>
body{margin:0;background:#000;color:#00e5ff;font-family:Arial;text-align:center}
h1{font-size:55px;text-shadow:0 0 30px #00e5ff;margin-top:50px}
.circle{width:200px;height:200px;border:4px solid #00e5ff;border-radius:50%;margin:30px auto;box-shadow:0 0 60px #00e5ff;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
button{padding:16px 45px;font-size:22px;background:#000;border:2px solid #00e5ff;color:#00e5ff;border-radius:50px;box-shadow:0 0 20px #00e5ff}
#chat{width:90%;max-width:500px;background:rgba(0,229,255,0.15);border:1px solid #00e5ff;padding:20px;border-radius:15px;margin:25px auto}
</style>
</head>
<body>
<h1>J.A.R.V.I.S</h1>
<div class="circle"></div>
<p>Just A Rather Very Intelligent System</p>
<button onclick="start()">🎤 Talk to JARVIS</button>
<div id="chat">Hello Sir, Systems Online. How can I help?</div>
<script>
function start(){
const R=window.SpeechRecognition||window.webkitSpeechRecognition;
const rec=new R(); rec.start();
document.getElementById('chat').innerHTML="Listening... Sir";
rec.onresult=function(e){
let v=e.results[0][0].transcript.toLowerCase();
let c=document.getElementById('chat');
c.innerHTML="You: "+v;
let reply="Yes Sir, I am here.";
if(v.includes("hello")) reply="Hello Sir, Welcome back, all systems at 100 percent";
if(v.includes("time")) reply="Time is "+new Date().toLocaleTimeString();
if(v.includes("name")) reply="I am JARVIS, Your personal AI assistant Sir";
if(v.includes("youtube")){window.open("https://youtube.com"); reply="Opening YouTube Sir";}
if(v.includes("google")){window.open("https://google.com"); reply="Opening Google Sir";}
let sp=new SpeechSynthesisUtterance(reply);
sp.pitch=0.8; sp.rate=0.9; speechSynthesis.speak(sp);
c.innerHTML+="<br><br><b>JARVIS:</b> "+reply;
}}
</script>
</body>
</html>
