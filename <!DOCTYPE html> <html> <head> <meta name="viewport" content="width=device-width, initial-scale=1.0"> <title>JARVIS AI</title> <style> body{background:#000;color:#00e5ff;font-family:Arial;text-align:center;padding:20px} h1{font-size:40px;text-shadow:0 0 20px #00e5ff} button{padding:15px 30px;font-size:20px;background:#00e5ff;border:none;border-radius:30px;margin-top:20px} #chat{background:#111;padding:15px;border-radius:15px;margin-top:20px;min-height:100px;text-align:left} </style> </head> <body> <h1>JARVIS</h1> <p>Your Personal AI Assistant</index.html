<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>
<style>
body{background:#000;color:#00e5ff;font-family:Arial;text-align:center;padding:20px}
h1{font-size:40px;text-shadow:0 0 20px #00e5ff}
button{padding:15px 30px;font-size:20px;background:#00e5ff;border:none;border-radius:30px;margin-top:20px}
#chat{background:#111;padding:15px;border-radius:15px;margin-top:20px;min-height:100px;text-align:left}
</style>
</head>
<body>
<h1>JARVIS</h1>
<p>Your Personal AI Assistant</p>
<button onclick="speak()">Talk to JARVIS</button>
<div id="chat">Hello Sir, I am JARVIS. How can I help you?</div>
<script>
function speak(){
var msg=new SpeechSynthesisUtterance("Hello Sir, I am JARVIS. Your website is now live!");
speechSynthesis.speak(msg);
document.getElementById('chat').innerHTML="JARVIS is Active! Your website is LIVE.";
}
</script>
</body>
</html>
